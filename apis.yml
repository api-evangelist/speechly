aid: speechly
name: Speechly
description: >-
  Speechly was a real-time spoken language understanding (SLU) and streaming
  speech recognition platform from a Finnish startup, offering low-latency voice
  transcription, intent/entity parsing, written language understanding (WLU),
  batch audio processing, and audio/text moderation through a gRPC API with
  browser, React, iOS, Unity/.NET, Python and Go client SDKs and a command-line
  interface. Speechly was acquired by Roblox; the standalone product and hosted
  API have since been discontinued — speechly.com now redirects to roblox.com,
  the api.speechly.com and docs.speechly.com hosts no longer resolve, and the
  github.com/speechly organization was archived on 2025-01-07. Its open-source
  client SDKs and protobuf/gRPC API definitions remain publicly available and are
  cataloged here by the API Evangelist enrichment pipeline.
